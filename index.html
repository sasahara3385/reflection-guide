
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>反射ガイド・テスト版</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#07131d;
 color:#eef9ff;
 font-family:system-ui,-apple-system,sans-serif;
}

button,input{
 font:inherit;
}

button{
 background:#233d51;
 color:white;
 border:1px solid #49677d;
 border-radius:9px;
 padding:10px;
 cursor:pointer;
}

button.on{
 background:#42d9c7;
 color:#062b2c;
}

#canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 touch-action:none;
}

#top{
 position:fixed;
 z-index:3;
 top:env(safe-area-inset-top);
 left:0;
 right:0;
 background:#12283be9;
 padding:9px;
 display:flex;
 justify-content:flex-end;
 align-items:center;
 gap:5px;
}

#top button,
#upload{
 font-size:12px;
 padding:8px;
 white-space:nowrap;
}

#upload{
 background:#233d51;
 color:white;
 border:1px solid #49677d;
 border-radius:9px;
 cursor:pointer;
}

#file{
 position:absolute;
 width:1px;
 height:1px;
 opacity:0;
 pointer-events:none;
}

#lock.locked{
 background:#42d9c7;
 color:#062b2c;
}

#drawer{
 position:fixed;
 z-index:4;
 bottom:0;
 left:0;
 right:0;
 max-height:84dvh;
 display:flex;
 flex-direction:column;
 background:#11283bf7;
 border-radius:18px 18px 0 0;
 transition:max-height .18s;
}

#drawer.closed{
 max-height:calc(57px + env(safe-area-inset-bottom));
}

#toggle{
 flex-shrink:0;
 background:#1a364b;
 border:0;
 border-radius:18px 18px 0 0;
 font-weight:700;
 padding:12px;
}

#toggle:before{
 content:"";
 display:block;
 width:38px;
 height:4px;
 border-radius:5px;
 background:#91acba;
 margin:0 auto 7px;
}

#settings{
 padding:12px 14px calc(18px + env(safe-area-inset-bottom));
 overflow-y:auto;
}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 margin:12px 0 7px;
}

.row label{
 font-size:13px;
}

input[type=number]{
 width:88px;
 background:#0b1e2d;
 color:white;
 border:1px solid #537388;
 border-radius:7px;
 padding:8px;
}

input[type=range]{
 width:100%;
 accent-color:#42d9c7;
}

.buttons{
 display:flex;
 gap:6px;
 margin:12px 0;
}

.buttons button{
 flex:1;
 min-width:0;
 font-size:12px;
 padding:10px 3px;
}

.section{
 border-top:1px solid #395268;
 padding-top:10px;
 margin-top:14px;
}

.section-title{
 font-size:13px;
 font-weight:700;
 color:#9cece2;
 margin:2px 0 10px;
}

.wall-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.wall-field{
 display:flex;
 flex-direction:column;
 gap:5px;
 font-size:12px;
 color:#c8e0ec;
}

.wall-field input{
 width:100%;
}

.hint{
 font-size:11px;
 color:#a9bfce;
 line-height:1.6;
 margin:8px 0;
}

#notice{
 position:fixed;
 z-index:5;
 top:calc(env(safe-area-inset-top) + 55px);
 left:12px;
 right:12px;
 padding:9px 12px;
 border-radius:9px;
 background:#123d40ed;
 color:#c5fff5;
 font-size:12px;
 line-height:1.5;
 display:none;
 pointer-events:none;
}

#notice.error{
 background:#6b2731ed;
 color:white;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<header id="top">
 <label for="file" id="upload">＋画像</label>
 <button id="lock">発射点固定</button>

 <input
  id="file"
  type="file"
  accept="image/*,.png,.jpg,.jpeg,.webp,.heic,.heif"
 >
</header>

<div id="notice"></div>

<div id="drawer" class="closed">
 <button id="toggle">▲ 設定メニューを開く</button>

 <div id="settings">

  <div class="row">
   <label for="bounce">反射回数（0〜20）</label>
   <input
    id="bounce"
    type="number"
    min="0"
    max="20"
    value="3"
   >
  </div>

  <input
   id="bounceRange"
   type="range"
   min="0"
   max="20"
   value="3"
  >

  <div class="section">
   <div class="section-title">
    キャラ判定サイズ（テスト用）
   </div>

   <div class="row">
    <label for="diameter">
     キャラ判定直径（画像px）
    </label>

    <input
     id="diameter"
     type="number"
     min="1"
     step="1"
     value="145"
    >
   </div>

   <div class="hint">
    直径を変更すると、判定円・反射位置・判定幅に反映されます。
   </div>
  </div>

  <div class="section">
   <div class="section-title">
    壁の位置・サイズ（テスト用）
   </div>

   <div class="wall-grid">

    <label class="wall-field">
     左端（%）
     <input
      id="wallLeft"
      type="number"
      min="0"
      max="100"
      step="0.1"
      value="3.4"
     >
    </label>

    <label class="wall-field">
     右端（%）
     <input
      id="wallRight"
      type="number"
      min="0"
      max="100"
      step="0.1"
      value="96.7"
     >
    </label>

    <label class="wall-field">
     上端（%）
     <input
      id="wallTop"
      type="number"
      min="0"
      max="100"
      step="0.1"
      value="18.8"
     >
    </label>

    <label class="wall-field">
     下端（%）
     <input
      id="wallBottom"
      type="number"
      min="0"
      max="100"
      step="0.1"
      value="67.7"
     >
    </label>

   </div>

   <div class="hint">
    画像全体を100%として指定します。
    左右・上下の数値差が壁の幅・高さになります。
   </div>

   <div class="row">
    <span style="font-size:12px">
     壁の幅・高さ
    </span>
    <span id="wallSize" style="font-size:12px"></span>
   </div>

   <div class="buttons">
    <button id="wallEdit">壁編集</button>
    <button id="wallReset">壁位置リセット</button>
   </div>
  </div>

  <div class="section">
   <div class="section-title">
    表示・ブロック
   </div>

   <div class="buttons">
    <button id="bandBtn" class="on">
     判定幅 ON
    </button>
   </div>

   <div class="buttons">
    <button id="addBlock">＋ブロック</button>
    <button id="removeBlock">ブロック削除</button>
   </div>
  </div>

 </div>
</div>

<script>
'use strict';

// =====================================
// 基本設定
// =====================================

const $=id=>document.getElementById(id);

const canvas=$('canvas');
const ctx=canvas.getContext('2d');

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rad=a=>a*Math.PI/180;

const LINE_COLOR='#ffffff';
const WALL_COLOR='#42e9d2';

// キャラ判定直径
const DEFAULT_DIAMETER=145;

const DEFAULT_WALL={
 left:3.4,
 right:96.7,
 top:18.8,
 bottom:67.7
};

const EPS=0.01;

let image=null;
let imageURL=null;

let W=1179;
let H=2556;

let origin={x:825,y:1534};
let wall={...DEFAULT_WALL};

let blocks=[];
let selected=-1;

let angle=-45;
let bounces=3;

// 編集可能なキャラ判定直径
let diameter=DEFAULT_DIAMETER;

let locked=false;
let wallEdit=false;
let bandOn=true;

let scale=1;
let ox=0;
let oy=0;

let drag=null;
let pointerId=null;
let last=null;
let pullStart=null;

let drawerOpen=false;
let noticeTimer=null;

// =====================================
// 共通処理
// =====================================

function getRadius(){
 return diameter/2;
}

function notify(s,error=false){
 const n=$('notice');

 n.textContent=s;
 n.classList.toggle('error',error);
 n.style.display='block';

 clearTimeout(noticeTimer);

 noticeTimer=setTimeout(()=>{
  n.style.display='none';
 },4000);
}

function rect(){
 return {
  x:W*wall.left/100,
  y:H*wall.top/100,
  w:W*(wall.right-wall.left)/100,
  h:H*(wall.bottom-wall.top)/100
 };
}

function point(e){
 const r=canvas.getBoundingClientRect();

 return {
  x:(e.clientX-r.left-ox)/scale,
  y:(e.clientY-r.top-oy)/scale
 };
}

function hit(p,c,r){
 return Math.hypot(
  p.x-c.x,
  p.y-c.y
 )<=r;
}

function setAngle(a){
 if(!Number.isFinite(a))return;

 angle=(((a+180)%360+360)%360)-180;
 draw();
}

// =====================================
// 設定欄の同期
// =====================================

function syncDiameter(){
 $('diameter').value=Number(diameter.toFixed(2));
}

function syncWallInputs(){
 $('wallLeft').value=Number(wall.left.toFixed(2));
 $('wallRight').value=Number(wall.right.toFixed(2));
 $('wallTop').value=Number(wall.top.toFixed(2));
 $('wallBottom').value=Number(wall.bottom.toFixed(2));

 const r=rect();

 $('wallSize').textContent=
  Math.round(r.w)+
  ' × '+
  Math.round(r.h)+
  ' px';
}

// =====================================
// 発射点の範囲制限
// =====================================

// メニューやヘッダーによる制限なし。
// 壁の内側だけに制限する。

function keepOriginVisible(){
 const r=rect();
 const radius=getRadius();

 const minX=r.x+radius;
 const maxX=r.x+r.w-radius;

 const minY=r.y+radius;
 const maxY=r.y+r.h-radius;

 origin.x=maxX>=minX
  ?clamp(origin.x,minX,maxX)
  :r.x+r.w/2;

 origin.y=maxY>=minY
  ?clamp(origin.y,minY,maxY)
  :r.y+r.h/2;
}

// =====================================
// 画面サイズ
// =====================================

function resize(){
 const vw=innerWidth;
 const vh=innerHeight;

 const dpr=Math.min(devicePixelRatio||1,2);

 canvas.width=Math.round(vw*dpr);
 canvas.height=Math.round(vh*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);

 scale=Math.min(vw/W,vh/H);
 ox=(vw-W*scale)/2;
 oy=(vh-H*scale)/2;

 keepOriginVisible();
 draw();
}

// =====================================
// メニュー
// =====================================

function setDrawer(open){
 drawerOpen=open;

 $('drawer').classList.toggle('closed',!open);

 $('toggle').textContent=open
  ?'▼ 設定メニューを閉じる'
  :'▲ 設定メニューを開く';

 requestAnimationFrame(draw);
}

$('toggle').onclick=()=>{
 setDrawer(!drawerOpen);
};

// =====================================
// 画像読み込み
// =====================================

$('file').addEventListener('change',e=>{
 const file=e.target.files?.[0];

 if(!file)return;

 notify('画像を読み込み中：'+file.name);

 const url=URL.createObjectURL(file);
 const im=new Image();

 im.onload=()=>{
  if(!im.naturalWidth||!im.naturalHeight){
   URL.revokeObjectURL(url);
   notify('画像サイズを取得できませんでした',true);
   return;
  }

  if(imageURL){
   URL.revokeObjectURL(imageURL);
  }

  imageURL=url;
  image=im;

  W=im.naturalWidth;
  H=im.naturalHeight;

  wall={...DEFAULT_WALL};
  origin={x:W*.70,y:H*.60};

  blocks=[];
  selected=-1;

  locked=false;
  wallEdit=false;

  syncLock();
  syncWallEdit();
  syncWallInputs();

  resize();

  notify('画像読み込み成功：'+W+'×'+H);
 };

 im.onerror=()=>{
  URL.revokeObjectURL(url);

  notify(
   '画像を表示できません。PNGまたはJPEGでお試しください。',
   true
  );
 };

 im.src=url;
 e.target.value='';
});

// =====================================
// 発射点固定
// =====================================

function syncLock(){
 $('lock').textContent=locked
  ?'固定解除'
  :'発射点固定';

 $('lock').classList.toggle('locked',locked);
}

$('lock').onclick=()=>{
 locked=!locked;
 syncLock();
 draw();
};

// =====================================
// 下側の操作丸
// =====================================

function controlPos(){
 return {
  x:origin.x,
  y:origin.y+630*(W/1179)
 };
}

// =====================================
// 壁編集
// =====================================

function syncWallEdit(){
 $('wallEdit').textContent=wallEdit
  ?'壁編集を終了'
  :'壁編集';

 $('wallEdit').classList.toggle('on',wallEdit);
}

function wallHit(p){
 const r=rect();
 const t=24/scale;

 const candidates=[
  {
   side:'left',
   distance:Math.abs(p.x-r.x),
   valid:p.y>=r.y-t&&p.y<=r.y+r.h+t
  },
  {
   side:'right',
   distance:Math.abs(p.x-r.x-r.w),
   valid:p.y>=r.y-t&&p.y<=r.y+r.h+t
  },
  {
   side:'top',
   distance:Math.abs(p.y-r.y),
   valid:p.x>=r.x-t&&p.x<=r.x+r.w+t
  },
  {
   side:'bottom',
   distance:Math.abs(p.y-r.y-r.h),
   valid:p.x>=r.x-t&&p.x<=r.x+r.w+t
  }
 ];

 candidates.sort((a,b)=>a.distance-b.distance);

 return candidates.find(
  x=>x.valid&&x.distance<=t
 )?.side||null;
}

$('wallEdit').onclick=()=>{
 wallEdit=!wallEdit;
 syncWallEdit();
 setDrawer(false);
 draw();
};

$('wallReset').onclick=()=>{
 wall={...DEFAULT_WALL};
 syncWallInputs();
 keepOriginVisible();
 draw();
};

function updateWallFromInput(side,value){
 const v=Number(value);

 if(!Number.isFinite(v))return;

 const minGap=2;

 if(side==='left'){
  wall.left=clamp(v,0,wall.right-minGap);
 }

 if(side==='right'){
  wall.right=clamp(v,wall.left+minGap,100);
 }

 if(side==='top'){
  wall.top=clamp(v,0,wall.bottom-minGap);
 }

 if(side==='bottom'){
  wall.bottom=clamp(v,wall.top+minGap,100);
 }

 syncWallInputs();
 keepOriginVisible();
 draw();
}

[
 ['wallLeft','left'],
 ['wallRight','right'],
 ['wallTop','top'],
 ['wallBottom','bottom']
].forEach(([id,side])=>{
 $(id).addEventListener('change',e=>{
  updateWallFromInput(side,e.target.value);
 });
});

// =====================================
// キャラ判定直径の変更
// =====================================

function setDiameter(value){
 const v=Number(value);

 if(!Number.isFinite(v)||v<=0){
  syncDiameter();
  return;
 }

 diameter=clamp(
  v,
  1,
  Math.max(W,H)*2
 );

 syncDiameter();
 keepOriginVisible();
 draw();
}

$('diameter').addEventListener('change',e=>{
 setDiameter(e.target.value);
});

// =====================================
// ブロック判定
// =====================================

function blockHit(p){
 for(let i=blocks.length-1;i>=0;i--){
  const b=blocks[i];

  if(
   p.x>=b.x&&
   p.x<=b.x+b.w&&
   p.y>=b.y&&
   p.y<=b.y+b.h
  ){
   return i;
  }
 }

 return -1;
}

// =====================================
// レイと矩形の衝突
// =====================================

function collision(p,d,box){
 const tx1=(box.x-p.x)/d.x;
 const tx2=(box.x+box.w-p.x)/d.x;
 const ty1=(box.y-p.y)/d.y;
 const ty2=(box.y+box.h-p.y)/d.y;

 const txMin=Math.min(tx1,tx2);
 const txMax=Math.max(tx1,tx2);
 const tyMin=Math.min(ty1,ty2);
 const tyMax=Math.max(ty1,ty2);

 const enter=Math.max(txMin,tyMin);
 const exit=Math.min(txMax,tyMax);

 if(
  !Number.isFinite(enter)||
  enter<0||
  enter>exit
 ){
  return null;
 }

 let nx=0;
 let ny=0;

 if(txMin>tyMin){
  nx=d.x>0?-1:1;
 }else{
  ny=d.y>0?-1:1;
 }

 return {
  t:enter,
  nx,
  ny
 };
}

// =====================================
// 反射経路計算
// =====================================

function trace(){
 const r=rect();
 const radius=getRadius();

 const inner={
  x:r.x+radius,
  y:r.y+radius,
  w:r.w-radius*2,
  h:r.h-radius*2
 };

 const path=[{...origin}];

 if(inner.w<=0||inner.h<=0){
  return {path};
 }

 const left=inner.x;
 const right=inner.x+inner.w;
 const top=inner.y;
 const bottom=inner.y+inner.h;

 let p={
  x:clamp(origin.x,left,right),
  y:clamp(origin.y,top,bottom)
 };

 let d={
  x:Math.cos(rad(angle)),
  y:Math.sin(rad(angle))
 };

 let reflectionCount=0;

 // 壁に接した状態から外向きに発射した場合、
 // その場で1回反射したものとして扱う。
 const touchX=
  (p.x<=left+EPS&&d.x<0)||
  (p.x>=right-EPS&&d.x>0);

 const touchY=
  (p.y<=top+EPS&&d.y<0)||
  (p.y>=bottom-EPS&&d.y>0);

 if(touchX||touchY){
  if(touchX)d.x=-d.x;
  if(touchY)d.y=-d.y;

  reflectionCount++;

  if(reflectionCount>bounces){
   return {path};
  }
 }

 // 計算上のみ微小移動
 p={
  x:clamp(p.x+d.x*EPS,left+EPS,right-EPS),
  y:clamp(p.y+d.y*EPS,top+EPS,bottom-EPS)
 };

 let iterations=0;

 while(iterations<100){
  iterations++;

  let best=null;

  const edges=[
   {axis:'x',value:left,nx:1,ny:0},
   {axis:'x',value:right,nx:-1,ny:0},
   {axis:'y',value:top,nx:0,ny:1},
   {axis:'y',value:bottom,nx:0,ny:-1}
  ];

  for(const edge of edges){
   const dv=edge.axis==='x'?d.x:d.y;

   if(Math.abs(dv)<1e-9)continue;

   if(d.x*edge.nx+d.y*edge.ny>=0){
    continue;
   }

   const cur=edge.axis==='x'?p.x:p.y;
   const t=(edge.value-cur)/dv;

   if(t<=EPS/10)continue;

   const x=p.x+d.x*t;
   const y=p.y+d.y*t;

   if(
    x<left-EPS||
    x>right+EPS||
    y<top-EPS||
    y>bottom+EPS
   ){
    continue;
   }

   if(!best||t<best.t){
    best={
     t,
     nx:edge.nx,
     ny:edge.ny
    };
   }
  }

  // ブロックとの衝突
  for(const b of blocks){
   const expanded={
    x:b.x-radius,
    y:b.y-radius,
    w:b.w+radius*2,
    h:b.h+radius*2
   };

   const h=collision(p,d,expanded);

   if(
    h&&
    h.t>EPS/10&&
    (!best||h.t<best.t)
   ){
    best=h;
   }
  }

  if(!best)break;

  const q={
   x:p.x+d.x*best.t,
   y:p.y+d.y*best.t
  };

  path.push(q);

  if(reflectionCount>=bounces){
   break;
  }

  reflectionCount++;

  const dot=d.x*best.nx+d.y*best.ny;

  d={
   x:d.x-2*dot*best.nx,
   y:d.y-2*dot*best.ny
  };

  p={
   x:q.x+d.x*EPS,
   y:q.y+d.y*EPS
  };
 }

 return {path};
}

// =====================================
// 描画
// =====================================

function draw(){
 const vw=innerWidth;
 const vh=innerHeight;

 if(!vw||!vh)return;

 ctx.clearRect(0,0,vw,vh);

 ctx.fillStyle='#091622';
 ctx.fillRect(0,0,vw,vh);

 ctx.save();

 ctx.translate(ox,oy);
 ctx.scale(scale,scale);

 // 背景画像
 if(image){
  try{
   ctx.drawImage(image,0,0,W,H);
  }catch(e){
   notify('画像描画エラー：'+e.message,true);
  }
 }else{
  ctx.fillStyle='#193547';
  ctx.fillRect(0,0,W,H);
 }

 const r=rect();
 const radius=getRadius();

 // ブロック
 blocks.forEach((b,i)=>{
  ctx.fillStyle=i===selected
   ?'rgba(255,188,85,.5)'
   :'rgba(255,150,80,.3)';

  ctx.fillRect(b.x,b.y,b.w,b.h);

  ctx.strokeStyle='#ffbc55';
  ctx.lineWidth=3/scale;
  ctx.strokeRect(b.x,b.y,b.w,b.h);
 });

 // 反射経路
 const result=trace();

 ctx.beginPath();

 result.path.forEach((p,i)=>{
  if(i===0){
   ctx.moveTo(p.x,p.y);
  }else{
   ctx.lineTo(p.x,p.y);
  }
 });

 ctx.lineCap='round';
 ctx.lineJoin='round';

 // 半透明の判定幅
 if(bandOn){
  ctx.strokeStyle='rgba(66,230,209,.22)';
  ctx.lineWidth=diameter;
  ctx.stroke();
 }

 // 白い中心ライン
 ctx.strokeStyle=LINE_COLOR;
 ctx.lineWidth=2.5/scale;
 ctx.stroke();

 // 壁枠
 ctx.strokeStyle=wallEdit
  ?'#ffe17b'
  :WALL_COLOR;

 ctx.lineWidth=3/scale;
 ctx.setLineDash([]);

 ctx.strokeRect(r.x,r.y,r.w,r.h);

 // 発射点の判定円
 ctx.beginPath();
 ctx.arc(
  origin.x,
  origin.y,
  radius,
  0,
  Math.PI*2
 );

 ctx.strokeStyle=locked
  ?'#ffd16d'
  :'#4effe6';

 ctx.lineWidth=2/scale;
 ctx.stroke();

 // 発射点の白い丸（直径8画面px固定）
 ctx.beginPath();
 ctx.arc(
  origin.x,
  origin.y,
  4/scale,
  0,
  Math.PI*2
 );

 ctx.fillStyle='#ffffff';
 ctx.fill();

 // 下側の操作丸
 if(!wallEdit){
  const c=controlPos();

  const rr=Math.max(
   22/scale,
   radius*.54
  );

  ctx.beginPath();
  ctx.arc(c.x,c.y,rr,0,Math.PI*2);

  ctx.fillStyle='rgba(63,226,216,.09)';
  ctx.fill();

  ctx.strokeStyle='rgba(90,244,229,.55)';
  ctx.lineWidth=2/scale;
  ctx.stroke();
 }

 ctx.restore();
}

// =====================================
// タッチ・マウス操作
// =====================================

canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();

 if(pointerId!==null)return;

 pointerId=e.pointerId;
 canvas.setPointerCapture(e.pointerId);

 const p=point(e);
 last=p;
 pullStart=null;

 if(wallEdit){
  drag=wallHit(p);
  return;
 }

 if(
  !locked&&
  hit(
   p,
   origin,
   Math.max(getRadius(),24/scale)
  )
 ){
  drag='origin';
  return;
 }

 if(
  !locked&&
  hit(
   p,
   controlPos(),
   Math.max(getRadius()*.54,28/scale)
  )
 ){
  drag='origin';
  return;
 }

 const b=blockHit(p);

 if(b>=0){
  selected=b;
  drag='block';
  return;
 }

 drag='pull';
 pullStart=p;
});

canvas.addEventListener('pointermove',e=>{
 if(e.pointerId!==pointerId)return;

 e.preventDefault();

 const p=point(e);
 const dx=p.x-last.x;
 const dy=p.y-last.y;

 if(wallEdit&&drag){
  const v=(
   drag==='left'||drag==='right'
  )?p.x/W*100:p.y/H*100;

  if(drag==='left'){
   wall.left=clamp(v,0,wall.right-2);
  }

  if(drag==='right'){
   wall.right=clamp(v,wall.left+2,100);
  }

  if(drag==='top'){
   wall.top=clamp(v,0,wall.bottom-2);
  }

  if(drag==='bottom'){
   wall.bottom=clamp(v,wall.top+2,100);
  }

  syncWallInputs();
  keepOriginVisible();

 }else if(drag==='origin'&&!locked){
  origin.x+=dx;
  origin.y+=dy;

  keepOriginVisible();

 }else if(drag==='block'&&selected>=0){
  const b=blocks[selected];

  b.x=clamp(b.x+dx,0,W-b.w);
  b.y=clamp(b.y+dy,0,H-b.h);

 }else if(drag==='pull'&&pullStart){
  const x=p.x-pullStart.x;
  const y=p.y-pullStart.y;

  if(Math.hypot(x,y)>2){
   setAngle(
    Math.atan2(-y,-x)*180/Math.PI
   );
  }
 }

 last=p;
 draw();
});

function endDrag(e){
 if(e.pointerId!==pointerId)return;

 pointerId=null;
 drag=null;
 pullStart=null;

 draw();
}

canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

// =====================================
// 反射回数（最大20回）
// =====================================

function setBounces(v){
 bounces=clamp(
  Math.round(Number(v)||0),
  0,20
 );

 $('bounce').value=bounces;
 $('bounceRange').value=bounces;

 draw();
}

$('bounce').oninput=e=>{
 setBounces(e.target.value);
};

$('bounceRange').oninput=e=>{
 setBounces(e.target.value);
};

// =====================================
// 判定幅の表示
// =====================================

$('bandBtn').onclick=()=>{
 bandOn=!bandOn;

 $('bandBtn').classList.toggle('on',bandOn);

 $('bandBtn').textContent=bandOn
  ?'判定幅 ON'
  :'判定幅 OFF';

 draw();
};

// =====================================
// ブロック追加・削除
// =====================================

$('addBlock').onclick=()=>{
 const s=W*.09;

 blocks.push({
  x:W/2-s/2,
  y:H/2-s/2,
  w:s,
  h:s
 });

 selected=blocks.length-1;

 setDrawer(false);
 draw();
};

$('removeBlock').onclick=()=>{
 if(selected>=0){
  blocks.splice(selected,1);
  selected=-1;
  draw();
 }else{
  notify('削除するブロックを選択してください');
 }
};

// =====================================
// 初期化
// =====================================

window.addEventListener('resize',resize);

syncLock();
syncWallEdit();
syncDiameter();
syncWallInputs();

resize();
setBounces(3);
draw();

</script>
</body>
</html>
